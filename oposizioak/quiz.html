<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz — santzez</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="cabecera">
  <div class="contenedor">
    <a class="cabecera__marca" href="/index.html">
      <img src="/assets/logo.svg" alt="" style="height:44px" />
      <span>
        <span class="cabecera__titulo">santzez</span>
        <span class="cabecera__subtitulo">the webpage</span>
      </span>
    </a>
    <nav class="cabecera__nav">
      <a href="/index.html">Inicio</a>
      <a href="/oposizioak/index.html">Oposizioak</a>
    </nav>
    <div class="cabecera__usuario" id="usuario-cabecera"></div>
  </div>
</header>

<main>
  <div class="contenedor-estrecho">
    <nav class="migas" id="quiz-migas">
      <a href="/index.html">Inicio</a> <span>›</span>
      <a href="/oposizioak/index.html">Oposizioak</a> <span>›</span>
      <span id="quiz-titulo-migas">Quiz</span>
    </nav>

    <!-- Tabs de navegación al tema (Apuntes/Podcasts/Qwiz). Solo se muestran
         si el ope del quiz proviene de un tema con estructura de tabs
         (típicamente OPE_CAU/T{n}/Qwiz). -->
    <div class="tabs" id="quiz-tabs" hidden>
      <div class="tabs__cabecera" role="tablist">
        <a class="tabs__tab" role="tab" id="tab-apuntes" href="#">Apuntes</a>
        <a class="tabs__tab" role="tab" id="tab-podcasts" href="#">Podcasts</a>
        <a class="tabs__tab activo" role="tab" aria-selected="true">Qwiz</a>
      </div>
    </div>

    <div class="quiz-cabecera">
      <h2 id="quiz-titulo">Quiz</h2>
      <div class="quiz-info">
        <div class="quiz-contador" id="contador-texto">Preparando…</div>
        <div class="cronometro" id="cronometro-display" title="Tiempo de ejercicio">
          <span class="cronometro__icono" aria-hidden="true">⏱</span>
          <span class="cronometro__tiempo">00:00</span>
        </div>
      </div>
    </div>

    <div class="barra-progreso" aria-hidden="true">
      <div class="barra-progreso__relleno" id="barra-relleno"></div>
    </div>

    <div id="quiz-raiz"></div>
  </div>
</main>

<footer class="pie">
  <div class="contenedor">
    <p style="margin:0">© santzez</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/preferencias.js"></script>
<script src="/js/view-transitions.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/storage.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="js/quiz-engine.js"></script>
<script>
  /* -------------------------------------------------------------
     Si el ?ope=... acaba en '/Qwiz' (viene de un tema con tabs),
     el usuario debería llegar al tab embebido, no a esta página
     independiente. Redirigimos automáticamente para que el quiz
     se muestre dentro del tab (con estado persistente al cambiar
     de tab).
     Si no, arrancamos el motor en esta página como antes.
     ------------------------------------------------------------- */
  (async function () {
    const sesion = await AuthSession.exigirLogin();
    if (!sesion) return;
    const params = new URLSearchParams(location.search);
    const opeParam = params.get('ope') || '';
    const temaParam = params.get('tema') || '';
    const modoParam = params.get('modo') || 'todas';

    // Si vienes de un tema con estructura de tabs, redirige al ope.html
    // con la información en query para que arranque el quiz dentro del tab.
    if (opeParam.endsWith('/Qwiz')) {
      const rutaTema = opeParam.replace(/\/Qwiz$/, '');
      const url = 'ope.html?ope=' + encodeURIComponent(rutaTema)
                + '&startQuiz=' + encodeURIComponent(temaParam)
                + (modoParam !== 'todas' ? '&startModo=' + encodeURIComponent(modoParam) : '')
                + '#Qwiz';
      location.replace(url);
      return;
    }

    // Arranque tradicional (opes que aún no usan tabs)
    QuizEngine.iniciar({
      ope: opeParam,
      tema: temaParam,
      modo: modoParam,
      usuarioId: sesion.user.id,
      cont: document.getElementById('quiz-raiz'),
      titulo: document.getElementById('quiz-titulo'),
      contador: document.getElementById('contador-texto'),
      barra: document.getElementById('barra-relleno'),
      cronometro: document.querySelector('#cronometro-display .cronometro__tiempo'),
    });
  })();
</script>
</body>
</html>
