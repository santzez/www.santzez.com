<script>
  /* -------------------------------------------------------------
     ope.html — navegación jerárquica de una oposición.
     Lee ?ope=<ruta> donde <ruta> puede ser una jerarquía separada
     por "/" (ej: OPE_DonostiaTIK_2024/Temario_General_C1).
     Renderiza según info.tipo:
       - "grupo" → tarjetas de sub-navegación (hijos)
       - "temas" → tarjetas de temas para lanzar el quiz
       - "vacio" → mensaje "próximamente"
     ------------------------------------------------------------- */
  (async function () {
    const sesion = await AuthSession.exigirLogin();
    if (!sesion) return;

    const params = new URLSearchParams(location.search);
    // Enlaces antiguos (oct-2026): la OPE se llamaba OPE_DONOSTIA_2026_2027
    // y el temario de CAU colgaba de Temario_Especifico/OPE_CAU.
    const opeAntigua = params.get('ope') || '';
    const opeNueva = opeAntigua
      .replace(/^OPE_DONOSTIA_2026_2027/, 'OPE_DonostiaTIK_2024')
      .replace('/Temario_Especifico/OPE_CAU', '/Temario_Especifico')
      // Temario General: antes Apuntes y Qwiz eran pestañas comunes; ahora
      // cada tema (T1–T8) tiene sus propias pestañas.
      .replace(/\/Temario_General_C1\/(Qwiz|Material_de_estudio)$/, '/Temario_General_C1');
    if (opeNueva !== opeAntigua) {
      params.set('ope', opeNueva);
      location.replace(`${location.pathname}?${params}`);
      return;
    }
    const rutaOpe = params.get('ope');
    if (!rutaOpe) { location.href = '/oposizioak/index.html'; return; }

    // Construir migas de pan a partir de la ruta jerárquica.
    // Mostramos texto sin guiones bajos, pero la URL/href se mantiene con el ID técnico.
    const NOMBRES = {
      Material_de_estudio: 'Apuntes',
      Temario_Especifico: 'Temario Específico',
      Temario_General_C1: 'Temario General C-1',
      Examenes_y_guia: 'Exámenes y guía',
    };
    const formatear = id => NOMBRES[id] || id.replace(/_/g, ' ');
    const partes = rutaOpe.split('/').filter(Boolean);
    const migas = document.getElementById('migas-navegacion');
    let acumulada = '';
    for (let i = 0; i < partes.length; i++) {
      acumulada += (i === 0 ? '' : '/') + partes[i];
      const esUltima = i === partes.length - 1;
      migas.insertAdjacentHTML('beforeend', ' <span>›</span> ');
      if (esUltima) {
        const span = document.createElement('span');
        span.textContent = formatear(partes[i]);
        migas.appendChild(span);
      } else {
        const a = document.createElement('a');
        a.href = `ope.html?ope=${encodeURIComponent(acumulada)}`;
        a.textContent = formatear(partes[i]);
        migas.appendChild(a);
      }
    }

    document.title = `${formatear(partes[partes.length - 1])} — santzez`;

    try {
      const resp = await fetch(`data/${rutaOpe}/info.json`, { cache: 'no-store' });
      if (resp.status === 404) {
        // Este tema/sección aún no tiene contenido publicado
        document.getElementById('ope-titulo').textContent = formatear(partes[partes.length - 1]);
        document.getElementById('ope-descripcion').textContent = '';
        document.getElementById('ope-subtitulo').textContent = 'Contenido';
        document.getElementById('lista-contenido').innerHTML = `
          <div class="tarjeta" style="text-align:center;padding:2.5rem">
            <div style="font-size:1.5rem;margin-bottom:0.75rem">🚧</div>
            <p style="margin:0 0 0.5rem;font-weight:600;color:var(--color-primario)">
              Este apartado todavía no tiene material publicado.
            </p>
            <p style="margin:0;color:var(--color-texto-suave);font-size:0.9rem">
              Se irá subiendo poco a poco. Vuelve pronto o revisa otros temas.
            </p>
          </div>`;
        return;
      }
      if (!resp.ok) throw new Error('No se pudo cargar la información');
      const info = await resp.json();

      // Secciones solo para el admin (p. ej. Informe del examen)
      if (info.soloAdmin && !(await AuthSession.esAdmin())) {
        document.getElementById('ope-titulo').textContent = 'Sin acceso';
        document.getElementById('lista-contenido').innerHTML =
          '<div class="tarjeta">Esta sección es privada.</div>';
        return;
      }

      document.getElementById('ope-titulo').textContent = info.nombre || rutaOpe;
      document.getElementById('ope-descripcion').textContent = info.descripcion || '';

      // Panel desplegable "+ INFO" con contenido HTML controlado desde el JSON
      const detalles = document.getElementById('ope-info-ampliada');
      if (info.infoAmpliada && String(info.infoAmpliada).trim().length > 0) {
        document.getElementById('ope-info-ampliada-contenido').innerHTML = info.infoAmpliada;
        detalles.hidden = false;
      }

      const contPrincipal = document.getElementById('lista-contenido');
      const subtituloPrincipal = document.getElementById('ope-subtitulo');
      contPrincipal.innerHTML = '';

      // Delega al renderizador que ahora acepta contenedor (para poder usarse
      // recursivamente dentro de las tabs).
      await renderTipoEn(info, contPrincipal, subtituloPrincipal, rutaOpe);
    } catch (err) {
      document.getElementById('lista-contenido').innerHTML =
        `<div class="tarjeta">Error: ${err.message}</div>`;
    }

    // =============================================================
    // Renderizado por tipo — recibe (info, cont, subtitulo, rutaOpe)
    // para poder reusarse dentro del modo TABS.
    // =============================================================
    // Título largo en móvil: muestra 3 líneas y, a los 3 s, desplaza el texto
    // despacio hasta el final, espera y vuelve arriba. Al tocarlo se ve entero.
    function tituloDesplazableEnMovil(el) {
      if (!el || !matchMedia('(max-width: 640px)').matches) return;
      el.classList.add('titulo-recortado');
      requestAnimationFrame(() => {
        const sobra = el.scrollHeight - el.clientHeight;
        if (sobra <= 2) { el.classList.remove('titulo-recortado'); return; }
        el.addEventListener('click', () => el.classList.remove('titulo-recortado'), { once: true });
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const desplazar = (hasta, ms) => new Promise(res => {
          const desde = el.scrollTop, t0 = performance.now();
          const paso = (t) => {
            const k = Math.min(1, (t - t0) / ms);
            el.scrollTop = desde + (hasta - desde) * k;
            k < 1 ? requestAnimationFrame(paso) : res();
          };
          requestAnimationFrame(paso);
        });
        const espera = (ms) => new Promise(r => setTimeout(r, ms));
        (async () => {
          await espera(3000);
          await desplazar(sobra, Math.max(2500, sobra * 45));
          el.classList.add('titulo-final');
          await espera(2500);
          el.classList.remove('titulo-final');
          await desplazar(0, 800);
        })();
      });
    }

    // Buscador del temario por bloques: filtra por título al instante y, con
    // 3+ caracteres, busca también dentro del texto de los apuntes de cada tema
    // (se descargan una sola vez, la primera vez que hace falta).
    function montarBuscadorTemas(info, cont, rutaOpe) {
      const sinTildes = (t) => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
      const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
      const temas = info.bloques.flatMap(b => (b.temas || []).map(t => ({ ...t, bloque: b.titulo || b.id })));
      let textos = null;   // { T1: 'texto plano de los apuntes', ... }
      const cargarTextos = async () => {
        if (textos) return textos;
        const pares = await Promise.all(temas.map(async t => {
          try {
            const r = await fetch(`data/${rutaOpe}/${t.id}/Material_de_estudio/${t.id}.html`);
            const doc = new DOMParser().parseFromString(r.ok ? await r.text() : '', 'text/html');
            return [t.id, doc.body.textContent.replace(/\s+/g, ' ')];
          } catch { return [t.id, '']; }
        }));
        textos = Object.fromEntries(pares);
        return textos;
      };

      const caja = document.createElement('div');
      caja.className = 'buscador-temas';
      caja.innerHTML = `
        <input type="search" class="buscador-temas__input" placeholder="Buscar en el temario (p. ej. «DHCP», «RAID 5», «ITIL»)…" aria-label="Buscar en el temario">
        <div class="buscador-temas__resultados" hidden></div>`;
      cont.appendChild(caja);
      const input = caja.querySelector('input');
      const res = caja.querySelector('.buscador-temas__resultados');
      let turno = 0, t0;

      const buscar = async () => {
        const q = sinTildes(input.value.trim());
        const bloques = cont.querySelectorAll('.bloque');
        if (!q) { res.hidden = true; bloques.forEach(b => b.hidden = false); return; }
        bloques.forEach(b => b.hidden = true);
        res.hidden = false;
        const mio = ++turno;
        const pintar = (txt) => {
          const filas = temas.map(t => {
            const enTitulo = sinTildes(`${t.id} ${t.titulo} ${t.tituloOficial}`).includes(q);
            let n = 0, frag = '';
            if (txt) {
              const plano = txt[t.id] || '', bajo = sinTildes(plano);
              for (let i = bajo.indexOf(q); i !== -1; i = bajo.indexOf(q, i + q.length)) {
                if (!n) frag = plano.slice(Math.max(0, i - 60), i + q.length + 80);
                n++;
              }
            }
            return { t, enTitulo, n, frag };
          }).filter(x => x.enTitulo || x.n).sort((a, b) => (b.enTitulo - a.enTitulo) || (b.n - a.n));
          res.innerHTML = filas.length ? filas.map(({ t, enTitulo, n, frag }) => `
            <a class="buscador-temas__item" href="ope.html?ope=${encodeURIComponent(`${rutaOpe}/${t.id}`)}#Material_de_estudio">
              <span class="bloque-tema__id">${t.id}</span>
              <span class="buscador-temas__texto">
                <span class="buscador-temas__titulo">${esc(t.titulo || t.id)}</span>
                <span class="buscador-temas__meta">${esc(t.bloque)}${n ? ` · ${n} coincidencia${n === 1 ? '' : 's'} en los apuntes` : ''}${enTitulo ? ' · en el título' : ''}</span>
                ${frag ? `<span class="buscador-temas__frag">…${esc(frag)}…</span>` : ''}
              </span>
            </a>`).join('')
            : `<p class="buscador-temas__vacio">${txt ? 'Ningún tema contiene «' + esc(input.value.trim()) + '».' : 'Buscando en los apuntes…'}</p>`;
        };
        pintar(textos);
        if (q.length >= 3 && !textos) {
          const txt = await cargarTextos();
          if (mio === turno) pintar(txt);
        }
      };
      input.addEventListener('input', () => { clearTimeout(t0); t0 = setTimeout(buscar, 250); });
    }

    async function renderTipoEn(info, cont, subtitulo, rutaOpe) {
      // MODO TABS — grupo con renderComoTabs=true
      // Carga los N hijos en paralelo y los muestra como pestañas persistentes.
      if (info.tipo === 'grupo' && info.renderComoTabs && Array.isArray(info.hijos) && info.hijos.length > 0) {
        subtitulo.hidden = true;
        // Oculta cabecera global de la página: el HTML del tema y los propios
        // paneles llevan su propia identidad (badge, título, etc.).
        const opeTit = document.getElementById('ope-titulo');
        const opeDesc = document.getElementById('ope-descripcion');
        const opeInfoAmp = document.getElementById('ope-info-ampliada');
        if (opeTit) opeTit.hidden = true;
        if (opeDesc) opeDesc.hidden = true;
        if (opeInfoAmp) opeInfoAmp.hidden = true;

        // Tab virtual "Claude" al final si hay Apuntes (tipo contenido)
        const TAB_CLAUDE_ID = '__claude__';

        // Iconos SVG line-art para cada tab.
        //  · Apuntes  → libro abierto
        //  · Qwiz     → interrogante en círculo
        //  · Claude   → chispa/estrella de 4 puntas
        const ICONO_APUNTES = `<svg class="tabs__icono" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v16H6.5A2.5 2.5 0 0 1 4 16.5V5.5Z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v16h5.5A2.5 2.5 0 0 0 20 16.5V5.5Z"/></svg>`;
        const ICONO_QWIZ = `<svg class="tabs__icono" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>`;
        const ICONO_CLAUDE = `<svg class="tabs__icono" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.6 5.8a2 2 0 0 0 1.6 1.6L21 12l-5.8 1.6a2 2 0 0 0-1.6 1.6L12 21l-1.6-5.8a2 2 0 0 0-1.6-1.6L3 12l5.8-1.6a2 2 0 0 0 1.6-1.6L12 3Z"/></svg>`;
        const ICONO_EXAMEN = `<svg class="tabs__icono" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/></svg>`;
        const ICONO_PDF = `<svg class="tabs__icono" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>`;
        const iconoDe = (h) => {
          if (!h) return '';
          if (h.id === 'Qwiz') return ICONO_QWIZ;
          if (h.id === 'Examen') return ICONO_EXAMEN;
          if (h.id === 'PDF') return ICONO_PDF;
          // Apuntes: hoy usa id "Material_de_estudio" con nombre "Apuntes"
          if (h.id === 'Material_de_estudio' || h.nombre === 'Apuntes') return ICONO_APUNTES;
          return '';
        };

        // Construir estructura de tabs (icono + texto en cada botón).
        const tabsWrap = document.createElement('div');
        tabsWrap.className = 'tabs';
        tabsWrap.innerHTML = `
          <div class="tabs__cabecera" role="tablist">
            ${info.hijos.map((h, i) => `
              <button type="button" role="tab" class="tabs__tab${i === 0 ? ' activo' : ''}"
                      data-tab="${h.id}" aria-selected="${i === 0}">
                ${iconoDe(h)}<span>${h.nombre || h.id}</span>
              </button>
            `).join('')}
            <button type="button" role="tab" class="tabs__tab tabs__tab--ia"
                    data-tab="${TAB_CLAUDE_ID}" aria-selected="false" hidden
                    title="Pregunta a la IA sobre este tema">
              ${ICONO_CLAUDE}<span>Ask_Claude</span>
            </button>
          </div>
          <div class="tabs__paneles">
            ${info.hijos.map((h, i) => `
              <div class="tabs__panel" role="tabpanel" data-panel="${h.id}" ${i === 0 ? '' : 'hidden'}>
                <div class="skeleton-tarjeta">
                  <div class="skeleton-linea skeleton-linea--titulo"></div>
                  <div class="skeleton-linea skeleton-linea--larga"></div>
                  <div class="skeleton-linea skeleton-linea--corta"></div>
                </div>
              </div>
            `).join('')}
            <div class="tabs__panel tabs__panel--claude" role="tabpanel" data-panel="${TAB_CLAUDE_ID}" hidden>
              <aside class="chat-ia chat-ia--tab" id="chat-ia">
                <div class="chat-ia__cabecera">
                  <div class="chat-ia__titulo">Pregunta a la IA sobre este tema</div>
                  <div class="chat-ia__cuota" id="chat-cuota">···</div>
                  <button type="button" class="chat-ia__cerrar" id="chat-cerrar-split"
                          aria-label="Cerrar el chat y volver al panel completo" title="Cerrar split" hidden>
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6l-6 6-6 6"/></svg>
                  </button>
                </div>
                <div class="chat-ia__mensajes" id="chat-mensajes">
                  <div class="chat-ia__vacio">
                    Escribe una duda sobre este tema y Claude te responderá usando los apuntes cargados.
                  </div>
                </div>
                <form class="chat-ia__form" id="chat-form">
                  <textarea id="chat-input" placeholder="¿Qué dice el art. 21 sobre…?" rows="2" required></textarea>
                  <button type="submit" class="btn" id="chat-enviar">Enviar</button>
                </form>
              </aside>
            </div>
          </div>
        `;
        // -------- Barra de contexto sticky: "Bloque X · … ::: T{n} · Título" --------
        // Se construye si el padre inmediato tiene tipo "bloques" y encontramos
        // el T{n} actual dentro de uno de ellos. Queda pegada arriba al hacer scroll.
        let barraContexto = null;
        let navTemas = null;      // «← T1 · …   T3 · … →» al final de la página del tema
        let cambiarTabRef = null; // asignada más abajo, referenciada en la barra
        try {
          const partesRuta = rutaOpe.split('/').filter(Boolean);
          const idActual = partesRuta[partesRuta.length - 1];
          const rutaPadre = partesRuta.slice(0, -1).join('/');
          if (rutaPadre) {
            const rP = await fetch(`data/${rutaPadre}/info.json`, { cache: 'no-store' });
            if (rP.ok) {
              const infoP = await rP.json();
              if (infoP.tipo === 'bloques' && Array.isArray(infoP.bloques)) {
                let bloqueMatch = null, temaMatch = null;
                for (const b of infoP.bloques) {
                  const t = (b.temas || []).find(x => x.id === idActual);
                  if (t) { bloqueMatch = b; temaMatch = t; break; }
                }
                if (bloqueMatch && temaMatch) {
                  // Sentinel de 1px justo antes de la barra: cuando sale del
                  // viewport por arriba, sabemos que la barra está "stuck".
                  const sentinel = document.createElement('div');
                  sentinel.className = 'tema-contexto-sentinel';
                  cont.appendChild(sentinel);

                  barraContexto = document.createElement('div');
                  barraContexto.className = 'tema-contexto';
                  barraContexto.innerHTML = `
                    <div class="tema-contexto__info">
                      <span class="tema-contexto__bloque">${bloqueMatch.titulo || bloqueMatch.id}</span>
                      <span class="tema-contexto__sep" aria-hidden="true">:::</span>
                      <span class="tema-contexto__tema">
                        <strong>${temaMatch.id}</strong> ${temaMatch.titulo || ''}
                      </span>
                    </div>
                    <div class="tema-contexto__nav">
                      <button type="button" class="tema-contexto__icono"
                              data-goto="Material_de_estudio" title="Ir a Apuntes" aria-label="Ir a Apuntes">
                        ${ICONO_APUNTES}
                      </button>
                      <button type="button" class="tema-contexto__icono"
                              data-goto="Qwiz" title="Ir a Qwiz" aria-label="Ir a Qwiz">
                        ${ICONO_QWIZ}
                      </button>
                      <button type="button" class="tema-contexto__icono tema-contexto__icono--ia"
                              data-goto="${TAB_CLAUDE_ID}" title="Ir a Ask_Claude" aria-label="Ir a Ask_Claude">
                        ${ICONO_CLAUDE}
                      </button>
                    </div>`;
                  cont.appendChild(barraContexto);

                  // Navegación al tema anterior / siguiente del mismo temario
                  const todos = infoP.bloques.flatMap(b => b.temas || []);
                  const pos = todos.findIndex(t => t.id === idActual);
                  const enlace = (t, dir) => t ? `
                    <a class="tema-nav__enlace tema-nav__enlace--${dir}" href="ope.html?ope=${encodeURIComponent(`${rutaPadre}/${t.id}`)}">
                      <span class="tema-nav__dir">${dir === 'ant' ? '← Anterior' : 'Siguiente →'}</span>
                      <span class="tema-nav__tema"><strong>${t.id}</strong> ${t.titulo || ''}</span>
                    </a>` : '<span></span>';
                  navTemas = document.createElement('nav');
                  navTemas.className = 'tema-nav';
                  navTemas.setAttribute('aria-label', 'Navegación entre temas');
                  navTemas.innerHTML = enlace(todos[pos - 1], 'ant') + enlace(todos[pos + 1], 'sig');
                  // Se conserva la pestaña activa (Apuntes, Qwiz…) al cambiar de tema
                  navTemas.addEventListener('click', (e) => {
                    const a = e.target.closest('a');
                    if (a && location.hash && !location.hash.startsWith('#split-')) a.href = a.href.split('#')[0] + location.hash;
                  });

                  // Detecta cuándo la barra pasa a estar "pegada" arriba:
                  // cuando el sentinel sale del viewport, activamos --stuck.
                  if ('IntersectionObserver' in window) {
                    const io = new IntersectionObserver((entradas) => {
                      for (const e of entradas) {
                        barraContexto.classList.toggle('tema-contexto--stuck', !e.isIntersecting);
                      }
                    }, { threshold: 0, rootMargin: '0px 0px 0px 0px' });
                    io.observe(sentinel);
                  }
                }
              }
            }
          }
        } catch { /* silencioso: si falla el lookup, no bloqueamos la vista */ }
        // -----------------------------------------------------------------------

        cont.appendChild(tabsWrap);
        if (navTemas) cont.appendChild(navTemas);

        // Cuando la barra existe, sus iconos disparan el cambio de tab
        if (barraContexto) {
          barraContexto.querySelectorAll('[data-goto]').forEach(btn => {
            btn.addEventListener('click', () => cambiarTabRef && cambiarTabRef(btn.dataset.goto));
          });
        }

        // Handlers de cambio de tab (con hash en la URL para deep-link)
        // -------------------------------------------------------------
        //  MODO SPLIT: si el usuario pulsa ASK_CLAUDE viniendo desde Apuntes
        //  o Qwiz, no cambiamos de tab; en su lugar el panel origen queda a
        //  2/3 a la izquierda y el chat aparece a 1/3 a la derecha. Al pulsar
        //  Apuntes/Qwiz o el botón X del chat se sale del modo split.
        // -------------------------------------------------------------
        const panelesWrap = tabsWrap.querySelector('.tabs__paneles');
        const btnCerrarSplit = tabsWrap.querySelector('#chat-cerrar-split');
        const IDS_SPLIT_ORIGEN = new Set(['Material_de_estudio', 'Qwiz']);
        const panelDe = (id) => tabsWrap.querySelector(`.tabs__panel[data-panel="${id}"]`);
        const esOrigenSplit = (id) => IDS_SPLIT_ORIGEN.has(id) || !!panelDe(id)?.__contextoHtml;
        // Último panel con contenido visitado: es el contexto de Ask_Claude
        let panelContexto = null;
        // En móvil la tira de pestañas se desplaza para que se vea la activa
        const centrarTabActiva = () => {
          const cab = tabsWrap.querySelector('.tabs__cabecera');
          const btn = cab?.querySelector('.tabs__tab.activo:not(.tabs__tab--ia)') || cab?.querySelector('.tabs__tab.activo');
          if (!cab || !btn || cab.scrollWidth <= cab.clientWidth) return;
          cab.scrollTo({ left: btn.offsetLeft - (cab.clientWidth - btn.offsetWidth) / 2, behavior: 'smooth' });
        };
        let origenSplit = null;   // 'Material_de_estudio' | 'Qwiz' | null
        // La función que monta el chat perezosamente se define más abajo, en
        // el bloque panelApuntes. Aquí guardamos un placeholder no-op para
        // poder llamarlo desde entrarEnSplit sin importar el orden.
        let montarChatIA = () => {};

        const salirDeSplit = () => {
          if (!origenSplit) return;
          origenSplit = null;
          panelesWrap.classList.remove('modo-split');
          if (btnCerrarSplit) btnCerrarSplit.hidden = true;
        };

        const entrarEnSplit = (origen) => {
          origenSplit = origen;
          panelesWrap.classList.add('modo-split');
          if (btnCerrarSplit) btnCerrarSplit.hidden = false;
          montarChatIA();
          // Los dos paneles visibles son "origen" (2/3) y ASK_CLAUDE (1/3)
          tabsWrap.querySelectorAll('.tabs__panel').forEach(p => {
            const id = p.dataset.panel;
            p.hidden = (id !== origen && id !== TAB_CLAUDE_ID);
          });
          // Marcamos como activos ambos tabs
          tabsWrap.querySelectorAll('.tabs__tab').forEach(b => {
            const activo = (b.dataset.tab === origen || b.dataset.tab === TAB_CLAUDE_ID);
            b.classList.toggle('activo', activo);
            b.setAttribute('aria-selected', activo);
          });
          history.replaceState(null, '', location.pathname + location.search + '#split-' + origen);
          centrarTabActiva();
        };

        const cambiarTab = (idTab) => {
          // ¿Es una transición Apuntes/Qwiz -> ASK_CLAUDE? => activa split.
          const activoActual = tabsWrap.querySelector('.tabs__tab.activo')?.dataset.tab;
          if (idTab === TAB_CLAUDE_ID && esOrigenSplit(activoActual) && !origenSplit) {
            entrarEnSplit(activoActual);
            // Cronómetro de Qwiz: pausamos cuando dejamos de mirarlo activamente
            if (activoActual === 'Qwiz' && window.QuizEngine && QuizEngine.estaActivo()) {
              // seguimos "viendo" el Qwiz, así que dejamos el crono corriendo
            }
            return;
          }
          // Cualquier otro clic saca del split (si estamos en él)
          if (origenSplit) salirDeSplit();

          tabsWrap.querySelectorAll('.tabs__tab').forEach(b => {
            const activo = b.dataset.tab === idTab;
            b.classList.toggle('activo', activo);
            b.setAttribute('aria-selected', activo);
          });
          tabsWrap.querySelectorAll('.tabs__panel').forEach(p => {
            p.hidden = p.dataset.panel !== idTab;
          });
          // Actualiza la URL con hash (sin recargar)
          history.replaceState(null, '', location.pathname + location.search + '#' + idTab);
          if (panelDe(idTab)?.__contextoHtml) panelContexto = panelDe(idTab);
          centrarTabActiva();

          // Cronómetro del quiz: pausa si sales del tab Qwiz, reanuda si vuelves.
          if (window.QuizEngine && QuizEngine.estaActivo()) {
            if (idTab === 'Qwiz') QuizEngine.reanudarCronometro();
            else                   QuizEngine.pausarCronometro();
          }
        };

        // Botón X del chat: sale del split y vuelve al origen a ancho completo
        if (btnCerrarSplit) {
          btnCerrarSplit.addEventListener('click', () => {
            if (origenSplit) cambiarTab(origenSplit);
          });
        }
        cambiarTabRef = cambiarTab; // expone la función a la barra de contexto
        tabsWrap.querySelectorAll('.tabs__tab').forEach(btn => {
          btn.addEventListener('click', () => cambiarTab(btn.dataset.tab));
        });

        // Detectar hash inicial (deep-link) — case-insensitive
        const hashObjetivo = decodeURIComponent(location.hash.replace('#', ''));
        if (hashObjetivo) {
          const match = info.hijos.find(h =>
            h.id.toLowerCase() === hashObjetivo.toLowerCase()
          );
          if (match) cambiarTab(match.id);
        }

        // Cargar contenido de cada hijo en su panel (paralelo)
        await Promise.all(info.hijos.map(async (h) => {
          const panel = tabsWrap.querySelector(`[data-panel="${h.id}"]`);
          const rutaHijo = `${rutaOpe}/${h.id}`;
          try {
            const r = await fetch(`data/${rutaHijo}/info.json`, { cache: 'no-store' });
            if (!r.ok) {
              panel.innerHTML = `<div class="tarjeta" style="text-align:center;padding:2rem">
                <div style="font-size:1.5rem">🚧</div>
                <p style="color:var(--color-texto-suave);margin:0.5rem 0 0">
                  Este apartado todavía no tiene contenido publicado.
                </p>
              </div>`;
              return;
            }
            const infoHijo = await r.json();
            panel.innerHTML = '';
            // Contenedor "subtitulo" fantasma (dentro de tabs no queremos H2)
            const subFalso = document.createElement('span');
            subFalso.hidden = true;
            await renderTipoEn(infoHijo, panel, subFalso, rutaHijo);
          } catch (e) {
            panel.innerHTML = `<div class="tarjeta">Error: ${e.message}</div>`;
          }
        }));

        // Con los paneles ya cargados: contexto de Ask_Claude = pestaña activa
        // (si es de contenido) y la tira de pestañas centrada en la activa.
        {
          const activa = tabsWrap.querySelector('.tabs__tab.activo')?.dataset.tab;
          if (panelDe(activa)?.__contextoHtml) panelContexto = panelDe(activa);
          centrarTabActiva();
        }

        // === Tab Claude ===
        // Si alguno de los hijos es tipo "contenido" (Apuntes), activamos la tab
        // y montamos el chat perezosamente la primera vez que se abre.
        const panelApuntes = Array.from(tabsWrap.querySelectorAll('.tabs__panel'))
          .find(p => p.__contextoHtml);
        if (panelApuntes) {
          const btnClaude = tabsWrap.querySelector('.tabs__tab--ia');
          const panelClaude = tabsWrap.querySelector('.tabs__panel--claude');
          btnClaude.hidden = false;
          let chatMontado = false;
          const montarChatSiFalta = () => {
            if (chatMontado || !window.ChatIA) return;
            chatMontado = true;
            ChatIA.montar({
              contenedor: panelClaude.querySelector('#chat-ia'),
              cliente: AuthSession.cliente(),
              idTema: () => (panelContexto || panelApuntes).__idTema,
              contextoHtml: () => (panelContexto || panelApuntes).__contextoHtml,
            });
          };
          // Exponemos la función al closure de cambiarTab/entrarEnSplit
          montarChatIA = montarChatSiFalta;
          btnClaude.addEventListener('click', montarChatSiFalta);
          // Si el usuario aterriza directo con hash #__claude__
          if (decodeURIComponent(location.hash.replace('#', '')).toLowerCase() === TAB_CLAUDE_ID) {
            montarChatSiFalta();
          }
        }
        return;
      }

      // Tipo "contenido" → fragmento HTML con material de estudio.
      // El chat IA vive en su propia pestaña "Claude" (inyectada por el modo tabs),
      // por lo que aquí solo pintamos los apuntes a ancho completo.
      if (info.tipo === 'contenido' && (info.html || info.privado)) {
        subtitulo.hidden = true;
        try {
          let htmlFragmento;
          if (info.privado) {
            // Contenido privado: no está en el repo (público), sino en un
            // bucket de Supabase que solo puede leer el admin (RLS).
            const { data, error } = await AuthSession.cliente().storage
              .from(info.privado.bucket).download(info.privado.ruta);
            if (error) throw new Error('No se pudo cargar el contenido');
            htmlFragmento = await data.text();
          } else {
            const r = await fetch(`data/${rutaOpe}/${info.html}`, { cache: 'no-store' });
            if (!r.ok) throw new Error('No se pudo cargar el contenido');
            htmlFragmento = await r.text();
          }
          cont.classList.add('tema-contenedor');
          cont.innerHTML = htmlFragmento;
          document.getElementById('ope-titulo').hidden = true;
          document.getElementById('ope-descripcion').hidden = true;
          // Guardamos el HTML en el propio contenedor para que la tab Claude
          // hermana pueda leerlo como contexto (ver modo tabs más abajo).
          tituloDesplazableEnMovil(cont.querySelector('.tema-cabecera__titulo'));
          cont.dataset.contextoHtml = 'listo';
          cont.__contextoHtml = htmlFragmento;
          cont.__idTema = rutaOpe.split('/').slice(-2)[0]; // T{n}
        } catch (e) {
          cont.innerHTML = `<div class="tarjeta">Error cargando el contenido: ${e.message}</div>`;
        }
        return;
      }

      // Tipo "examen" → simulacro por apartados (datos en el bucket privado)
      if (info.tipo === 'examen' && info.privado) {
        subtitulo.hidden = true;
        try {
          const { data, error } = await AuthSession.cliente().storage
            .from(info.privado.bucket).download(info.privado.ruta);
          if (error) throw new Error('No se pudo cargar el examen');
          const doc = new DOMParser().parseFromString(await data.text(), 'text/html');
          const datos = JSON.parse(doc.getElementById('examen-datos').textContent);
          ExamenSim.montar({ contenedor: cont, datos });
        } catch (e) {
          cont.innerHTML = `<div class="tarjeta">Error cargando el examen: ${e.message}</div>`;
        }
        return;
      }

      // Tipo "bloques" → acordeón: bloques colapsables con temas dentro
      if (info.tipo === 'bloques' && Array.isArray(info.bloques)) {
        subtitulo.textContent = 'Temario por bloques';
        montarBuscadorTemas(info, cont, rutaOpe);
        info.bloques.forEach((bloque, iB) => {
          const details = document.createElement('details');
          details.className = 'bloque tarjeta--aparecer';
          // Con un único bloque no tiene sentido obligar a desplegarlo
          if (info.bloques.length === 1) details.open = true;
          details.style.animationDelay = (iB * 80) + 'ms';
          const nTemas = bloque.temas?.length || 0;
          details.innerHTML = `
            <summary class="bloque__summary">
              <div class="bloque__titulo">${bloque.titulo || bloque.id}</div>
              <div class="bloque__meta">
                <span class="bloque__contador">${nTemas} tema${nTemas === 1 ? '' : 's'}</span>
                <span class="bloque__chevron" aria-hidden="true">▸</span>
              </div>
            </summary>
            <div class="bloque__contenido">
              ${bloque.descripcion ? `<p class="bloque__descripcion">${bloque.descripcion}</p>` : ''}
              <div class="bloque__temas"></div>
            </div>
          `;
          const temasCont = details.querySelector('.bloque__temas');
          (bloque.temas || []).forEach((tema, iT) => {
            const rutaTema = `${rutaOpe}/${tema.id}`;
            const a = document.createElement('a');
            a.className = 'bloque-tema tarjeta--aparecer';
            a.style.animationDelay = (iT * 40) + 'ms';
            a.href = `ope.html?ope=${encodeURIComponent(rutaTema)}`;
            a.innerHTML = `
              <span class="bloque-tema__id">${tema.id}</span>
              <span class="bloque-tema__titulo">${tema.titulo || tema.id}</span>
              <span class="bloque-tema__flecha" aria-hidden="true">›</span>
            `;
            temasCont.appendChild(a);
          });
          cont.appendChild(details);
        });
        if (info.bloques.length === 0) {
          cont.innerHTML = '<div class="tarjeta">No hay bloques definidos todavía.</div>';
        }
        return;
      }

      // Tipo "material" → PDFs por tema en Supabase Storage
      if (info.tipo === 'material') {
        await renderMaterial(info, rutaOpe, cont, subtitulo);
        return;
      }

      // Tipo "vacio" → mensaje "próximamente"
      if (info.tipo === 'vacio') {
        subtitulo.textContent = 'Contenido';
        cont.innerHTML = `
          <div class="tarjeta" style="text-align:center;padding:2rem">
            <div style="font-size:1.2rem;margin-bottom:0.5rem">⏳</div>
            <p style="margin:0;color:var(--color-texto-suave, #666)">
              ${info.mensaje || 'Contenido próximamente disponible.'}
            </p>
          </div>`;
        return;
      }

      // Tipo "grupo" → renderizar hijos como tarjetas navegables
      if (info.tipo === 'grupo' && Array.isArray(info.hijos)) {
        subtitulo.textContent = 'Selecciona una sección';
        const esAdmin = await AuthSession.esAdmin();
        info.hijos.filter(h => !h.soloAdmin || esAdmin).forEach((hijo, i) => {
          const rutaHijo = `${rutaOpe}/${hijo.id}`;
          const a = document.createElement('a');
          a.className = 'tarjeta tarjeta--clicable tarjeta--aparecer';
          a.style.animationDelay = (i * 60) + 'ms';
          a.href = `ope.html?ope=${encodeURIComponent(rutaHijo)}`;
          a.innerHTML = `
            <div class="tarjeta__titulo">${hijo.nombre || hijo.id}</div>
            <p class="tarjeta__descripcion">${hijo.descripcion || ''}</p>`;
          cont.appendChild(a);
        });
        if (info.hijos.length === 0) {
          cont.innerHTML = '<div class="tarjeta">Sin contenido todavía.</div>';
        }
        return;
      }

      // Tipo "temas" (o info.temas presente) → listado de temas para el quiz.
      // Al pulsar un tema, se embebe el motor de quiz DENTRO del contenedor
      // (no se navega), para preservar el estado al cambiar de tab.
      if (info.tipo === 'temas' || Array.isArray(info.temas)) {
        subtitulo.textContent = 'Temas';

        // Estructura: [lista de temas] + [contenedor del quiz oculto]
        const listaWrap = document.createElement('div');
        listaWrap.className = 'qwiz-lista';
        const motorWrap = document.createElement('div');
        motorWrap.className = 'qwiz-motor';
        motorWrap.hidden = true;
        motorWrap.innerHTML = `
          <div class="quiz-cabecera">
            <h2 class="quiz-titulo qwiz-embed__titulo">Quiz</h2>
            <div class="quiz-info">
              <div class="quiz-contador qwiz-embed__contador">Preparando…</div>
              <div class="cronometro qwiz-embed__cronometro" title="Tiempo de ejercicio">
                <span class="cronometro__icono" aria-hidden="true">⏱</span>
                <span class="cronometro__tiempo">00:00</span>
              </div>
            </div>
          </div>
          <div class="barra-progreso" aria-hidden="true">
            <div class="barra-progreso__relleno qwiz-embed__barra"></div>
          </div>
          <div class="qwiz-embed__raiz"></div>
        `;
        cont.appendChild(listaWrap);
        cont.appendChild(motorWrap);

        // Iniciar quiz embebido con el tema pulsado
        const arrancarQuiz = (temaId, modo, limite) => {
          listaWrap.hidden = true;
          motorWrap.hidden = false;
          QuizEngine.iniciar({
            ope: rutaOpe,
            tema: temaId,
            modo: modo || 'todas',
            limite: limite || null,
            usuarioId: sesion.user.id,
            cont: motorWrap.querySelector('.qwiz-embed__raiz'),
            titulo: motorWrap.querySelector('.qwiz-embed__titulo'),
            contador: motorWrap.querySelector('.qwiz-embed__contador'),
            barra: motorWrap.querySelector('.qwiz-embed__barra'),
            cronometro: motorWrap.querySelector('.qwiz-embed__cronometro .cronometro__tiempo'),
            alVolver: () => {
              motorWrap.hidden = true;
              listaWrap.hidden = false;
              QuizEngine.destruir();
            },
          });
        };

        // Render de la card de estadísticas de un tema — la reusamos para
        // repintar cuando se resetea el progreso.
        const renderStatsTema = async (tema, contenedor, indice = 0) => {
          let preguntas = [];
          try {
            const r = await fetch(`data/${rutaOpe}/${tema.id}.json`, { cache: 'no-store' });
            if (r.ok) {
              const d = await r.json();
              preguntas = d.preguntas || [];
            }
          } catch {}
          const numPreguntas = preguntas.length;

          let numFalladas = 0, intentosCompletos = 0, numVistas = 0;
          if (numPreguntas > 0) {
            try {
              const [falladas, ic, vistas] = await Promise.all([
                Storage.preguntasFalladas(sesion.user.id, preguntas),
                Storage.intentosCompletos(sesion.user.id, rutaOpe, tema.id, numPreguntas),
                Storage.preguntasVistas(sesion.user.id, preguntas),
              ]);
              numFalladas = falladas.length;
              intentosCompletos = ic;
              numVistas = vistas.length;
            } catch (e) { console.warn('No se pudieron leer las stats:', e); }
          }

          const card = document.createElement('div');
          card.className = 'qwiz-stats tarjeta--aparecer';
          card.style.animationDelay = (indice * 60) + 'ms';
          card.innerHTML = `
            <h2 class="qwiz-stats__titulo">${tema.titulo || tema.id}</h2>
            <div class="qwiz-stats__grid">
              <div class="qwiz-stats__celda">
                <div class="qwiz-stats__valor">${numPreguntas}</div>
                <div class="qwiz-stats__label">preguntas</div>
              </div>
              <div class="qwiz-stats__celda">
                <div class="qwiz-stats__valor">${numVistas}<small>/${numPreguntas}</small></div>
                <div class="qwiz-stats__label">vistas</div>
              </div>
              <div class="qwiz-stats__celda">
                <div class="qwiz-stats__valor">${intentosCompletos}</div>
                <div class="qwiz-stats__label">intento${intentosCompletos === 1 ? '' : 's'} completo${intentosCompletos === 1 ? '' : 's'}</div>
              </div>
              <div class="qwiz-stats__celda">
                <div class="qwiz-stats__valor ${numFalladas > 0 ? 'qwiz-stats__valor--warning' : ''}">${numFalladas}</div>
                <div class="qwiz-stats__label">pendiente${numFalladas === 1 ? '' : 's'}</div>
              </div>
            </div>
            <div class="qwiz-stats__acciones">
              <span class="qwiz-stats__tandas">
                <span class="qwiz-stats__tandas-label">Empezar tanda:</span>
                ${[20, 50].filter(n => n < numPreguntas).map(n =>
                  `<button type="button" class="btn" data-accion="tanda" data-limite="${n}">${n}</button>`).join('')}
                <button type="button" class="btn" data-accion="todas" ${numPreguntas === 0 ? 'disabled' : ''}>
                  Todas (${numPreguntas})
                </button>
              </span>
              <button type="button" class="btn btn--secundario" data-accion="falladas" ${numFalladas === 0 ? 'disabled' : ''}>
                Repasar Fallos${numFalladas > 0 ? ` (${numFalladas})` : ''}
              </button>
              <button type="button" class="btn btn--peligro" data-accion="reset"
                      ${(numFalladas === 0 && intentosCompletos === 0) ? 'disabled' : ''}>
                Resetear
              </button>
            </div>
          `;

          card.querySelector('[data-accion="todas"]')
            ?.addEventListener('click', () => arrancarQuiz(tema.id, 'todas'));
          card.querySelectorAll('[data-accion="tanda"]').forEach(b =>
            b.addEventListener('click', () => arrancarQuiz(tema.id, 'todas', Number(b.dataset.limite))));
          card.querySelector('[data-accion="falladas"]')
            ?.addEventListener('click', () => arrancarQuiz(tema.id, 'falladas'));
          card.querySelector('[data-accion="reset"]')
            ?.addEventListener('click', async () => {
              const ok = confirm(
                `¿Resetear todo el progreso de ${tema.id}?\n\n` +
                'Se borrarán tus intentos, las sesiones y los fallos acumulados de este tema.\n' +
                'Esta acción no se puede deshacer.'
              );
              if (!ok) return;
              const ids = preguntas.map(p => p.id);
              const res = await Storage.borrarProgresoTema(sesion.user.id, rutaOpe, tema.id, ids);
              if (!res.ok) {
                alert('No se pudo resetear: ' + (res.motivo || 'error desconocido'));
                return;
              }
              // Repinta la card en su sitio (sustituye el nodo)
              const nueva = await renderStatsTema(tema, contenedor, indice);
              card.replaceWith(nueva);
            });

          return card;
        };

        let indiceTema = 0;
        for (const tema of info.temas || []) {
          const card = await renderStatsTema(tema, listaWrap, indiceTema++);
          listaWrap.appendChild(card);
        }
        if (!info.temas || info.temas.length === 0) {
          listaWrap.innerHTML = '<div class="tarjeta">No hay temas cargados todavía.</div>';
        }

        // Auto-arranque si venimos de quiz.html?startQuiz=T1
        const paramsPagina = new URLSearchParams(location.search);
        const startQuiz = paramsPagina.get('startQuiz');
        if (startQuiz && (info.temas || []).some(t => t.id === startQuiz)) {
          arrancarQuiz(startQuiz, paramsPagina.get('startModo') || 'todas');
        }

        return;
      }

      // Sin tipo reconocido
      cont.innerHTML = '<div class="tarjeta">Formato de contenido no reconocido.</div>';
    }
    // -------------------------------------------------------------
    // Renderizado tipo "material": PDFs por tema en Supabase Storage
    // -------------------------------------------------------------
    async function renderMaterial(info, rutaOpe, contPasado, subtituloPasado) {
      const cont = contPasado || document.getElementById('lista-contenido');
      const subtitulo = subtituloPasado || document.getElementById('ope-subtitulo');
      if (!subtitulo.hidden) subtitulo.textContent = 'Apuntes por tema';
      cont.innerHTML = '';

      const bucket = info.bucket || 'material';
      // El prefijo es la propia ruta jerárquica quitando el último nivel
      // (Material_de_estudio). Así los PDFs viven en:
      //   material/OPE_DonostiaTIK_2024/Temario_General_C1/T1/*.pdf
      // info.prefijo permite apuntar a otra carpeta (p. ej. la pestaña PDF de
      // cada tema del Temario General reutiliza la carpeta de siempre).
      const prefijoBase = info.prefijo || rutaOpe.replace(/\/[^/]+$/, '');
      const cliente = AuthSession.cliente();

      // Detectar admin
      let esAdmin = false;
      try { esAdmin = await AuthSession.esAdmin(); } catch {}

      // Formateador de tamaño
      const kb = b => b < 1024*1024
        ? `${(b/1024).toFixed(1)} KB`
        : `${(b/1024/1024).toFixed(1)} MB`;

      // Función que refresca la lista de un tema
      async function cargarPDFsTema(temaId, listaNodo) {
        listaNodo.innerHTML = '<div class="skeleton-linea skeleton-linea--larga"></div><div class="skeleton-linea skeleton-linea--corta"></div>';
        const carpeta = `${prefijoBase}/${temaId}`;
        const { data, error } = await cliente.storage.from(bucket).list(carpeta, {
          limit: 100, sortBy: { column: 'name', order: 'asc' }
        });
        if (error) {
          listaNodo.innerHTML = `<p class="material__vacio">Error cargando la lista: ${error.message}</p>`;
          return;
        }
        const pdfs = (data || []).filter(x => x.name && x.name.toLowerCase().endsWith('.pdf'));
        if (pdfs.length === 0) {
          listaNodo.innerHTML = '<p class="material__vacio">Aún no hay PDFs en este tema.</p>';
          return;
        }
        listaNodo.innerHTML = '';
        for (const pdf of pdfs) {
          const rutaCompleta = `${carpeta}/${pdf.name}`;
          const { data: pub } = cliente.storage.from(bucket).getPublicUrl(rutaCompleta);
          const url = pub.publicUrl;
          const tam = pdf.metadata?.size ? kb(pdf.metadata.size) : '';
          const fila = document.createElement('div');
          fila.className = 'material-pdf';
          fila.innerHTML = `
            <div class="material-pdf__icono">📄</div>
            <div class="material-pdf__info">
              <div class="material-pdf__nombre">${pdf.name}</div>
              ${tam ? `<div class="material-pdf__meta">${tam}</div>` : ''}
            </div>
            <div class="material-pdf__acciones">
              <a class="btn btn--secundario" href="${url}" target="_blank" rel="noopener">Ver</a>
              <a class="btn btn--secundario" href="${url}" download="${pdf.name}">↓ Descargar</a>
              ${esAdmin ? `
                <button type="button" class="btn-icono material-pdf__btn" data-accion="renombrar" data-nombre="${pdf.name}" title="Renombrar">✎</button>
                <button type="button" class="btn-icono material-pdf__btn material-pdf__btn--peligro" data-accion="borrar" data-nombre="${pdf.name}" title="Borrar">🗑</button>
              ` : ''}
            </div>
          `;
          // Handlers admin
          if (esAdmin) {
            fila.querySelector('[data-accion="renombrar"]').addEventListener('click', async () => {
              const nuevo = prompt(`Nuevo nombre para "${pdf.name}"`, pdf.name);
              if (!nuevo || nuevo === pdf.name) return;
              const nombreFinal = nuevo.toLowerCase().endsWith('.pdf') ? nuevo : nuevo + '.pdf';
              const { error } = await cliente.storage.from(bucket).move(rutaCompleta, `${carpeta}/${nombreFinal}`);
              if (error) return alert(`Error renombrando: ${error.message}`);
              await cargarPDFsTema(temaId, listaNodo);
            });
            fila.querySelector('[data-accion="borrar"]').addEventListener('click', async () => {
              if (!confirm(`¿Borrar "${pdf.name}"? Esta acción no se puede deshacer.`)) return;
              const { error } = await cliente.storage.from(bucket).remove([rutaCompleta]);
              if (error) return alert(`Error borrando: ${error.message}`);
              await cargarPDFsTema(temaId, listaNodo);
            });
          }
          listaNodo.appendChild(fila);
        }
      }

      // Función que sube un archivo
      async function subirArchivo(file, temaId, listaNodo, barra) {
        if (!file) return;
        if (!file.type.includes('pdf') && !file.name.toLowerCase().endsWith('.pdf')) {
          alert('Solo se admiten archivos PDF.');
          return;
        }
        if (file.size > 50 * 1024 * 1024) {
          alert('El archivo supera el máximo de 50 MB.');
          return;
        }
        const rutaCompleta = `${prefijoBase}/${temaId}/${file.name}`;
        barra.classList.add('material__barra--visible');
        barra.textContent = `Subiendo ${file.name}…`;
        const { error } = await cliente.storage.from(bucket).upload(rutaCompleta, file, {
          cacheControl: '3600', upsert: true, contentType: 'application/pdf'
        });
        barra.classList.remove('material__barra--visible');
        if (error) return alert(`Error subiendo: ${error.message}`);
        await cargarPDFsTema(temaId, listaNodo);
      }

      // Render principal: una tarjeta por tema
      const temas = info.temas || [];
      if (temas.length === 0) {
        cont.innerHTML = '<div class="tarjeta">No hay temas definidos.</div>';
        return;
      }
      temas.forEach((tema, i) => {
        const div = document.createElement('div');
        div.className = 'tarjeta tarjeta--material tarjeta--aparecer';
        div.style.animationDelay = (i * 60) + 'ms';
        div.innerHTML = `
          <div class="material__cabecera">
            <div class="tarjeta__titulo"><span class="tema-badge">${tema.id}</span> ${tema.titulo || tema.id}</div>
          </div>
          <div class="material__lista"></div>
          ${esAdmin ? `
            <div class="material__admin">
              <div class="material__barra"></div>
              <div class="material__dropzone" tabindex="0">
                <div class="material__dropzone-txt">
                  <strong>Arrastra PDFs aquí</strong> o pulsa para seleccionar
                </div>
                <input type="file" accept="application/pdf,.pdf" multiple hidden>
              </div>
            </div>
          ` : ''}
        `;
        const listaNodo = div.querySelector('.material__lista');
        cargarPDFsTema(tema.id, listaNodo);

        // Handlers admin: drag & drop + input file
        if (esAdmin) {
          const barra = div.querySelector('.material__barra');
          const zona = div.querySelector('.material__dropzone');
          const input = div.querySelector('input[type="file"]');

          zona.addEventListener('click', () => input.click());
          zona.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); }
          });
          input.addEventListener('change', async () => {
            for (const f of input.files) await subirArchivo(f, tema.id, listaNodo, barra);
            input.value = '';
          });
          ['dragenter','dragover'].forEach(ev =>
            zona.addEventListener(ev, e => { e.preventDefault(); zona.classList.add('material__dropzone--activa'); })
          );
          ['dragleave','drop'].forEach(ev =>
            zona.addEventListener(ev, e => { e.preventDefault(); zona.classList.remove('material__dropzone--activa'); })
          );
          zona.addEventListener('drop', async e => {
            e.preventDefault();
            const files = Array.from(e.dataTransfer.files);
            for (const f of files) await subirArchivo(f, tema.id, listaNodo, barra);
          });
        }
        cont.appendChild(div);
      });
    }
  })();
</script>
